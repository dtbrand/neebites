<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="auto">
  <defs>
    <radialGradient id="carBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="70%" stop-color="#F7ECE0"/>
      <stop offset="100%" stop-color="#EAD5C2"/>
    </radialGradient>
    <linearGradient id="chocCaramelShell" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#C58532"/>
      <stop offset="45%" stop-color="#9C5A14"/>
      <stop offset="85%" stop-color="#6F3908"/>
      <stop offset="100%" stop-color="#4A2303"/>
    </linearGradient>
    <linearGradient id="liquidCaramel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2A53D"/>
      <stop offset="50%" stop-color="#D67D1E"/>
      <stop offset="100%" stop-color="#8F4805"/>
    </linearGradient>
    <linearGradient id="almondNut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6B3"/>
      <stop offset="50%" stop-color="#D9A86C"/>
      <stop offset="100%" stop-color="#A0632D"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#936D10"/>
    </linearGradient>
    <filter id="carShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#4A2303" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#carBg)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="395" rx="145" ry="24" fill="#2D1609" opacity="0.16"/>
  <ellipse cx="250" cy="392" rx="110" ry="16" fill="#2D1609" opacity="0.22"/>

  <!-- Main Enrobed Chocolate Coated Almond -->
  <g filter="url(#carShadow)">
    <path d="M250,110 C320,135 365,220 345,310 C330,370 275,385 240,385 C195,385 145,360 140,290 C135,210 190,120 250,110 Z" fill="url(#chocCaramelShell)"/>

    <!-- Specular Highlight -->
    <ellipse cx="220" cy="180" rx="35" ry="18" fill="#FFFFFF" opacity="0.28" transform="rotate(-35 220 180)"/>

    <!-- Liquid Golden Caramel Ribbon Drizzle -->
    <path d="M165,225 C210,195 270,230 325,200 C335,220 320,235 300,240 C250,250 205,220 165,225 Z" fill="url(#liquidCaramel)"/>
    <path d="M150,275 C200,250 260,285 335,260 C345,280 325,295 305,300 C255,310 195,275 150,275 Z" fill="url(#liquidCaramel)"/>

    <!-- French Fleur De Sel Salt Crystals -->
    <rect x="230" y="170" width="6" height="6" fill="#FFFFFF" opacity="0.9" transform="rotate(45 233 173)"/>
    <rect x="270" y="220" width="7" height="7" fill="#FFFFFF" opacity="0.85" transform="rotate(30 273 223)"/>
    <rect x="180" y="260" width="5" height="5" fill="#FFFFFF" opacity="0.9" transform="rotate(15 182 262)"/>
    <rect x="290" y="320" width="6" height="6" fill="#FFFFFF" opacity="0.85" transform="rotate(60 293 323)"/>

    <!-- Nut Reveal Cross Section Inlay -->
    <g transform="translate(195, 235)">
      <ellipse cx="40" cy="40" rx="28" ry="36" fill="url(#almondNut)" transform="rotate(-15 40 40)"/>
      <ellipse cx="40" cy="40" rx="23" ry="30" fill="#FDF3E3" opacity="0.9" transform="rotate(-15 40 40)"/>
      <path d="M35,16 Q40,40 37,64" stroke="#D9A86C" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Luxury Badge Top Left -->
  <g transform="translate(35, 40)">
    <rect width="145" height="34" rx="17" fill="url(#goldRibbon)"/>
    <text x="72" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#241408">FLEUR DE SEL</text>
  </g>

  <!-- Flavour Badge Bottom Right -->
  <g transform="translate(275, 425)">
    <rect width="190" height="38" rx="19" fill="#9C5A14"/>
    <text x="95" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FAF6F0">🍯 Caramel Almond</text>
  </g>
</svg>
