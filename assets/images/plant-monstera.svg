<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="auto">
  <defs>
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="70%" stop-color="#F2EAE0"/>
      <stop offset="100%" stop-color="#E5D8C8"/>
    </radialGradient>
    <linearGradient id="chocDarkGrad" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#4A2612"/>
      <stop offset="35%" stop-color="#32170A"/>
      <stop offset="80%" stop-color="#210F05"/>
      <stop offset="100%" stop-color="#140802"/>
    </linearGradient>
    <linearGradient id="chocHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A56E42" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#734220" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#32170A" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="almondNut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6B3"/>
      <stop offset="50%" stop-color="#D9A86C"/>
      <stop offset="100%" stop-color="#A0632D"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#936D10"/>
    </linearGradient>
    <filter id="chocShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2D1609" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#darkBg)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="395" rx="145" ry="24" fill="#2D1609" opacity="0.18"/>
  <ellipse cx="250" cy="392" rx="110" ry="16" fill="#2D1609" opacity="0.25"/>

  <!-- Cocoa Pod Leaf Accents -->
  <path d="M120,380 C95,350 90,290 125,255 C145,290 140,350 120,380 Z" fill="#6B4226" opacity="0.3"/>
  <path d="M380,380 C405,350 410,290 375,255 C355,290 360,350 380,380 Z" fill="#6B4226" opacity="0.3"/>

  <!-- Main Enrobed Chocolate Coated Almond -->
  <g filter="url(#chocShadow)">
    <!-- Main Almond Body -->
    <path d="M250,110 C320,135 365,220 345,310 C330,370 275,385 240,385 C195,385 145,360 140,290 C135,210 190,120 250,110 Z" fill="url(#chocDarkGrad)"/>

    <!-- Glossy Specular Surface Glaze -->
    <path d="M245,130 C295,150 335,210 320,285 C310,240 280,175 235,150 C215,138 230,132 245,130 Z" fill="url(#chocHighlight)"/>
    <ellipse cx="220" cy="180" rx="35" ry="18" fill="#FFFFFF" opacity="0.18" transform="rotate(-35 220 180)"/>

    <!-- Cocoa Butter Drizzle Swirl -->
    <path d="M175,260 Q240,225 315,265" stroke="#663518" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M165,290 Q245,255 330,295" stroke="#663518" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Nut Reveal Cross Section Inlay -->
    <g transform="translate(195, 235)">
      <ellipse cx="40" cy="40" rx="28" ry="36" fill="url(#almondNut)" transform="rotate(-15 40 40)"/>
      <ellipse cx="40" cy="40" rx="23" ry="30" fill="#FDF3E3" opacity="0.9" transform="rotate(-15 40 40)"/>
      <path d="M35,16 Q40,40 37,64" stroke="#D9A86C" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Cocoa Dust Particles -->
  <circle cx="160" cy="370" r="3" fill="#6B4226" opacity="0.6"/>
  <circle cx="175" cy="385" r="2.5" fill="#6B4226" opacity="0.5"/>
  <circle cx="330" cy="375" r="3" fill="#6B4226" opacity="0.6"/>
  <circle cx="345" cy="365" r="2" fill="#6B4226" opacity="0.4"/>
  <circle cx="280" cy="390" r="3.5" fill="#6B4226" opacity="0.5"/>

  <!-- Luxury Badge Top Left -->
  <g transform="translate(35, 40)">
    <rect width="135" height="34" rx="17" fill="url(#goldRibbon)"/>
    <text x="67" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#241408">70% BELGIAN</text>
  </g>

  <!-- Flavour Badge Bottom Right -->
  <g transform="translate(290, 425)">
    <rect width="175" height="38" rx="19" fill="#3D2314"/>
    <text x="87" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FAF6F0">🍫 Dark Almond</text>
  </g>
</svg>
