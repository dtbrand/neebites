<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="auto">
  <defs>
    <radialGradient id="whtBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF4EB"/>
      <stop offset="100%" stop-color="#EDE2D0"/>
    </radialGradient>
    <linearGradient id="chocWhiteShell" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="45%" stop-color="#F5EADC"/>
      <stop offset="85%" stop-color="#E2D0B8"/>
      <stop offset="100%" stop-color="#C7B297"/>
    </linearGradient>
    <linearGradient id="vanillaGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="50%" stop-color="#936D10"/>
      <stop offset="100%" stop-color="#6B4E08"/>
    </linearGradient>
    <linearGradient id="almondNut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6B3"/>
      <stop offset="50%" stop-color="#D9A86C"/>
      <stop offset="100%" stop-color="#A0632D"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#936D10"/>
    </linearGradient>
    <filter id="whtShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#5C4830" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#whtBg)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="395" rx="145" ry="24" fill="#2D1609" opacity="0.14"/>
  <ellipse cx="250" cy="392" rx="110" ry="16" fill="#2D1609" opacity="0.2"/>

  <!-- Vanilla Flower Petals in Background -->
  <g transform="translate(100, 260) rotate(-20)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="#FAF6EE"/>
    <ellipse cx="0" cy="0" rx="12" ry="30" fill="#FAF6EE"/>
    <circle cx="0" cy="0" r="6" fill="#C59B27"/>
  </g>
  <g transform="translate(400, 270) rotate(25)" opacity="0.35">
    <ellipse cx="0" cy="0" rx="28" ry="11" fill="#FAF6EE"/>
    <ellipse cx="0" cy="0" rx="11" ry="28" fill="#FAF6EE"/>
    <circle cx="0" cy="0" r="5" fill="#C59B27"/>
  </g>

  <!-- Main Enrobed Chocolate Coated Almond -->
  <g filter="url(#whtShadow)">
    <!-- Main Almond Body -->
    <path d="M250,110 C320,135 365,220 345,310 C330,370 275,385 240,385 C195,385 145,360 140,290 C135,210 190,120 250,110 Z" fill="url(#chocWhiteShell)" stroke="#D4C2A5" stroke-width="1.5"/>

    <!-- Specular Highlight -->
    <ellipse cx="220" cy="180" rx="35" ry="18" fill="#FFFFFF" opacity="0.6" transform="rotate(-35 220 180)"/>

    <!-- Bourbon Vanilla Bean Specks Dusted Over Shell -->
    <circle cx="210" cy="160" r="1.5" fill="#3D2314"/>
    <circle cx="230" cy="140" r="1.2" fill="#3D2314"/>
    <circle cx="270" cy="170" r="1.8" fill="#3D2314"/>
    <circle cx="290" cy="210" r="1.5" fill="#3D2314"/>
    <circle cx="310" cy="260" r="1.4" fill="#3D2314"/>
    <circle cx="170" cy="230" r="1.6" fill="#3D2314"/>
    <circle cx="180" cy="310" r="1.5" fill="#3D2314"/>
    <circle cx="220" cy="340" r="1.4" fill="#3D2314"/>
    <circle cx="270" cy="350" r="1.7" fill="#3D2314"/>
    <circle cx="300" cy="320" r="1.3" fill="#3D2314"/>

    <!-- Golden Bourbon Vanilla Glaze Drizzle Lines -->
    <path d="M170,240 Q240,210 320,245" stroke="url(#vanillaGlaze)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M155,280 Q245,245 330,285" stroke="url(#vanillaGlaze)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M175,320 Q240,295 310,320" stroke="url(#vanillaGlaze)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Nut Reveal Cross Section Inlay -->
    <g transform="translate(195, 235)">
      <ellipse cx="40" cy="40" rx="28" ry="36" fill="url(#almondNut)" transform="rotate(-15 40 40)"/>
      <ellipse cx="40" cy="40" rx="23" ry="30" fill="#FDF3E3" opacity="0.9" transform="rotate(-15 40 40)"/>
      <path d="M35,16 Q40,40 37,64" stroke="#D9A86C" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Luxury Badge Top Left -->
  <g transform="translate(35, 40)">
    <rect width="155" height="34" rx="17" fill="url(#goldRibbon)"/>
    <text x="77" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#241408">BOURBON VANILLA</text>
  </g>

  <!-- Flavour Badge Bottom Right -->
  <g transform="translate(280, 425)">
    <rect width="185" height="38" rx="19" fill="#C59B27"/>
    <text x="92" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#241408">🤍 White Almond</text>
  </g>
</svg>
