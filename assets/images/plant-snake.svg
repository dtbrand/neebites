<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="auto">
  <defs>
    <radialGradient id="cinBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="70%" stop-color="#F5E8DC"/>
      <stop offset="100%" stop-color="#E5D1BE"/>
    </radialGradient>
    <linearGradient id="chocCinShell" x1="20%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#844321"/>
      <stop offset="45%" stop-color="#662E12"/>
      <stop offset="85%" stop-color="#481F0B"/>
      <stop offset="100%" stop-color="#2D1105"/>
    </linearGradient>
    <linearGradient id="honeyGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="almondNut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6B3"/>
      <stop offset="50%" stop-color="#D9A86C"/>
      <stop offset="100%" stop-color="#A0632D"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#936D10"/>
    </linearGradient>
    <filter id="cinShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#381504" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#cinBg)"/>

  <!-- Pedestal shadow -->
  <ellipse cx="250" cy="395" rx="145" ry="24" fill="#2D1609" opacity="0.16"/>
  <ellipse cx="250" cy="392" rx="110" ry="16" fill="#2D1609" opacity="0.22"/>

  <!-- Main Enrobed Chocolate Coated Almond -->
  <g filter="url(#cinShadow)">
    <path d="M250,110 C320,135 365,220 345,310 C330,370 275,385 240,385 C195,385 145,360 140,290 C135,210 190,120 250,110 Z" fill="url(#chocCinShell)"/>

    <!-- Specular Highlight -->
    <ellipse cx="220" cy="180" rx="35" ry="18" fill="#FFFFFF" opacity="0.25" transform="rotate(-35 220 180)"/>

    <!-- Wild Honey Glaze Swirls -->
    <path d="M165,245 Q240,210 325,250" stroke="url(#honeyGlaze)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M150,285 Q245,245 335,288" stroke="url(#honeyGlaze)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85"/>

    <!-- Nut Reveal Cross Section Inlay -->
    <g transform="translate(195, 235)">
      <ellipse cx="40" cy="40" rx="28" ry="36" fill="url(#almondNut)" transform="rotate(-15 40 40)"/>
      <ellipse cx="40" cy="40" rx="23" ry="30" fill="#FDF3E3" opacity="0.9" transform="rotate(-15 40 40)"/>
      <path d="M35,16 Q40,40 37,64" stroke="#D9A86C" stroke-width="2" fill="none"/>
    </g>
  </g>

  <!-- Luxury Badge Top Left -->
  <g transform="translate(35, 40)">
    <rect width="145" height="34" rx="17" fill="url(#goldRibbon)"/>
    <text x="72" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#241408">CEYLON SPICE</text>
  </g>

  <!-- Flavour Badge Bottom Right -->
  <g transform="translate(275, 425)">
    <rect width="190" height="38" rx="19" fill="#662E12"/>
    <text x="95" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#FAF6F0">🍂 Cinnamon Almond</text>
  </g>
</svg>
